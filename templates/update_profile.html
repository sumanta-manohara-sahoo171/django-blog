{% extends 'index.html' %}

{% block title %}
    Update Profile - My Blog
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="mb-4">Update Profile</h2>

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <!-- Profile Picture -->

                        <div class="mb-4 text-center">

                            {% if profile.profile_pic %}

                                <img
                                    src="{{ profile.profile_pic.url }}"
                                    alt="Profile Picture"
                                    width="120"
                                    height="120"
                                    style="
                                        object-fit: cover;
                                        border-radius: 50%;
                                        border: 4px solid #eee;
                                    "
                                >

                            {% else %}

                                <div
                                    style="
                                        width: 120px;
                                        height: 120px;
                                        border-radius: 50%;
                                        background: #eee;
                                        display: flex;
                                        align-items: center;
                                        justify-content: center;
                                        margin: auto;
                                    "
                                >
                                    No Photo
                                </div>

                            {% endif %}

                        </div>

                        <div class="mb-3">

                            <label
                                for="profile_pic"
                                class="form-label"
                            >
                                Profile Picture
                            </label>

                            <input
                                type="file"
                                name="profile_pic"
                                id="profile_pic"
                                class="form-control"
                                accept="image/*"
                            >

                        </div>

                        <!-- Username -->

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                value="{{ request.user.username }}"
                                disabled
                            >

                        </div>

                        <!-- First Name -->

                        <div class="mb-3">

                            <label
                                for="fname"
                                class="form-label"
                            >
                                First Name
                            </label>

                            <input
                                type="text"
                                name="fname"
                                id="fname"
                                class="form-control"
                                value="{{ request.user.first_name }}"
                            >

                        </div>

                        <!-- Last Name -->

                        <div class="mb-3">

                            <label
                                for="lname"
                                class="form-label"
                            >
                                Last Name
                            </label>

                            <input
                                type="text"
                                name="lname"
                                id="lname"
                                class="form-control"
                                value="{{ request.user.last_name }}"
                            >

                        </div>

                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control"
                                value="{{ request.user.email }}"
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Update Profile
                        </button>

                        <a
                            href="{% url 'profile' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
