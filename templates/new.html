{% extends 'index.html' %}
{% load static %}

{% block content %}
    <div class="row">
        <div class="col-md-6">
            <h1>New Password</h1>
            <br><br>
            <form action="" method="POST">
                {% csrf_token %}
                <input type="password" name="new" placeholder="New Password" class="form-control mb-2" required>
                <br><br>
                <button type="submit" class="btn btn-primary">SUBMIT</button>
            </form>
            {% if msg %}
                <p class="msg">{{msg}}</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
