{% extends 'index.html' %}
{% load static %}

{% block content %}
    <div class="row">
        <div class="col-md-6">
            <h2>Reset Password</h2>
            <br><br>
            <form action="" method="POST">
                {% csrf_token %}
                <label for="">username:</label>
                <input type="text" name="username" id="" value="{{request.user.username}}" readonly class="form-control mb-2">
                <br><br>
                {% if new_pass %}
                    <label for="">Enter the new password:</label>
                    <input type="password" name="new" id="" placeholder="New Password" class="form-control mb-2"> 
                {% else %}
                    <label for="">Enter the old password:</label>
                    <input type="password" name="old" id="" placeholder="Old Password" class="form-control mb-2">
                {% endif %}

                <br><br>
                <button type="submit" class="btn btn-primary">SUBMIT</button>
            </form>
            <p class="msg">{{msg}}</p>
        </div>
    </div>
{% endblock %}
